services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    container_name: notify-server-ntfy
    command: serve
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./data/cache:/var/cache/ntfy
      - ./server.yml:/etc/ntfy/server.yml:ro
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true
