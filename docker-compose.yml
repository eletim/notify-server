services:
  ntfy:
    image: binwiederhier/ntfy:v2.27.0
    container_name: notify-server-ntfy
    command: serve
    env_file:
      - ./data/webpush.env
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./data/cache:/var/cache/ntfy
      - ./server.yml:/etc/ntfy/server.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    init: true

  caddy:
    image: caddy:2-alpine
    container_name: notify-server-caddy
    depends_on:
      ntfy:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    restart: unless-stopped
